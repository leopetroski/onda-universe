<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONDA Universe | Crowd Surf</title><style>*{box-sizing:border-box}body{margin:0;background:#081d32;color:white;font:16px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.pill{background:#071d35d9;border:1px solid #7bdce6;border-radius:15px;padding:10px 14px;box-shadow:0 4px 25px #0018}#logo{font-weight:900;font-size:22px;letter-spacing:2px}#logo small{display:block;font-size:11px;letter-spacing:4px;color:#ffc83d}.stats{display:flex;gap:14px}.stats span{color:#ffd35b}#panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:390px;width:calc(100% - 36px);background:#071b33e9;border:1px solid #82e8f0;border-radius:22px;text-align:center;padding:26px;box-shadow:0 12px 50px #001b}h1{margin:0 0 10px;font-size:30px}p{line-height:1.5;color:#c5e6ef}button{border:0;border-radius:13px;padding:13px 22px;background:#ffc83d;color:#09233a;font-weight:800;cursor:pointer;font-size:16px}#controls{position:absolute;bottom:20px;left:20px;right:20px;display:flex;justify-content:space-between;pointer-events:none}#controls button{pointer-events:auto;background:#082b49cc;border:1px solid #9fe9f0;color:white;font-size:24px;min-width:64px;min-height:64px;touch-action:none}#controls .pair{display:flex;gap:12px}#partner{position:absolute;right:14px;top:83px;background:#08283bcf;border:1px solid #ffcb5a;border-radius:12px;padding:9px 12px;font-size:12px;pointer-events:none}#partner strong{color:#ffd35b}@media(max-width:600px){.stats{gap:7px;font-size:12px}#logo{font-size:16px}.pill{padding:8px}#partner{top:75px}}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="pill" id="logo">🌊 ONDA <small>CROWD SURF</small></div><div class="pill stats"><div>SCORE <span id="score">0</span></div><div>WAVES <span id="coins">0</span></div><div>BEST <span id="best">0</span></div></div></div><div id="partner">📍 <strong>ONDA PARTNERS</strong><br>Coming soon · demo only</div><div id="panel"><h1>🏄 CROWD SURF</h1><p>Ride the wave. Collect golden Wave Points. Avoid swimmers and rocks. Jump over obstacles!</p><p><b>← → / A D</b> to steer<br><b>Space / ↑</b> to jump</p><button id="start">START SURFING</button></div><div id="controls"><div class="pair"><button id="left" aria-label="Steer left">◀</button><button id="right" aria-label="Steer right">▶</button></div><button id="jump" aria-label="Jump">⬆</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const canvas=document.getElementById('game'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color('#83d6f4');scene.fog=new THREE.Fog('#8bdaf0',32,110);const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,180);camera.position.set(0,6,13);camera.lookAt(0,1,-10);
scene.add(new THREE.HemisphereLight(0xffffff,0x258cba,2.5));const sun=new THREE.DirectionalLight(0xffe1a5,2.3);sun.position.set(-12,20,-35);scene.add(sun);
const mat=(c,roughness=.65)=>new THREE.MeshStandardMaterial({color:c,roughness});const oceanMat=new THREE.MeshStandardMaterial({color:0x078db0,roughness:.3,metalness:.08,side:THREE.DoubleSide});const oceanGeo=new THREE.PlaneGeometry(220,240,32,60);oceanGeo.rotateX(-Math.PI/2);const ocean=new THREE.Mesh(oceanGeo,oceanMat);ocean.position.z=-65;scene.add(ocean);const base=oceanGeo.attributes.position,original=Float32Array.from(base.array);
const board=new THREE.Group();scene.add(board);const surfboard=new THREE.Mesh(new THREE.CapsuleGeometry(.57,2.3,6,12),mat('#fff3da'));surfboard.rotation.x=Math.PI/2;surfboard.scale.set(1,.18,1);board.add(surfboard);const stripe=new THREE.Mesh(new THREE.BoxGeometry(.16,.05,2.6),mat('#10b5c5'));stripe.position.y=.18;board.add(stripe);
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.31,.85,5,10),mat('#f5ae7b'));torso.position.set(0,1.35,.2);torso.rotation.z=.15;board.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.25,12,10),mat('#f0b081'));head.position.set(0,2.15,.15);board.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.255,12,10),mat('#483022'));hair.scale.y=.42;hair.position.set(0,2.34,.15);board.add(hair);for(const s of [-1,1]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.6,5,8),mat('#152e53'));leg.position.set(s*.25,.65,s*.35);leg.rotation.x=s*.35;board.add(leg);const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.11,.6,5,8),mat('#f1b184'));arm.position.set(s*.49,1.45,.1);arm.rotation.z=s*.7;board.add(arm)}
const foam=[];for(let i=0;i<30;i++){const f=new THREE.Mesh(new THREE.BoxGeometry(1+Math.random()*2,.035,.035),new THREE.MeshBasicMaterial({color:0xc7ffff,transparent:true,opacity:.55}));f.position.set((Math.random()-.5)*25,.07,-Math.random()*105);scene.add(f);foam.push(f)}
const gold=mat('#ffc83d',.18),rockMat=mat('#525967'),swimMat=mat('#f17d55');let obstacles=[],running=false,score=0,coins=0,best=Number(localStorage.getItem('onda_best')||0),speed=14,spawn=0,playerX=0,vy=0,jumpY=0,steer=0,clock=new THREE.Clock();document.getElementById('best').textContent=best;
function makeItem(){let type=Math.random()<.42?'coin':Math.random()<.5?'rock':'swimmer';const lane=[-4,0,4][Math.floor(Math.random()*3)];let mesh;if(type==='coin'){mesh=new THREE.Mesh(new THREE.TorusGeometry(.55,.17,8,18),gold);mesh.rotation.y=Math.PI/2}else if(type==='rock'){mesh=new THREE.Mesh(new THREE.DodecahedronGeometry(.8),rockMat)}else{mesh=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.28,.8,4,8),swimMat);body.rotation.x=Math.PI/2;mesh.add(body);const h=new THREE.Mesh(new THREE.SphereGeometry(.25,10,8),mat('#f3c196'));h.position.z=-.65;mesh.add(h)}mesh.position.set(lane,type==='coin'?1.25:.5,-88);scene.add(mesh);obstacles.push({mesh,type,hit:false})}
function reset(){obstacles.forEach(o=>scene.remove(o.mesh));obstacles=[];score=coins=0;speed=14;spawn=.4;playerX=vy=jumpY=steer=0;running=true;document.getElementById('panel').style.display='none';document.getElementById('score').textContent=0;document.getElementById('coins').textContent=0;clock.getDelta()}
function end(){running=false;best=Math.max(best,Math.floor(score));localStorage.setItem('onda_best',best);document.getElementById('best').textContent=best;document.getElementById('panel').innerHTML=`<h1>🌊 WIPEOUT!</h1><p>Score: <b>${Math.floor(score)}</b><br>Wave Points collected: <b>${coins}</b><br>Best: <b>${best}</b></p><button id="restart">SURF AGAIN</button>`;document.getElementById('panel').style.display='block';document.getElementById('restart').onclick=reset}
document.getElementById('start').onclick=reset;const keys=new Set();addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();keys.add(e.code);if(!running&&e.code==='Enter')reset()});addEventListener('keyup',e=>keys.delete(e.code));let touchLeft=false,touchRight=false;for(const [id,set] of [['left',v=>touchLeft=v],['right',v=>touchRight=v]]){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);set(true)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>set(false))}let touchJump=false;document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();touchJump=true});document.getElementById('jump').addEventListener('pointerup',()=>touchJump=false);
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;for(let i=0;i<base.count;i++){const x=original[i*3],z=original[i*3+2];base.array[i*3+1]=.35*Math.sin(z*.33+t*1.9)+.15*Math.sin(x*.7+z*.17+t*2.7)}base.needsUpdate=true;for(const f of foam){f.position.z+=dt*(running?speed:6);if(f.position.z>18)f.position.z=-105}
if(running){steer=(keys.has('ArrowLeft')||keys.has('KeyA')||touchLeft?-1:0)+(keys.has('ArrowRight')||keys.has('KeyD')||touchRight?1:0);playerX=THREE.MathUtils.clamp(playerX+steer*dt*8,-5,5);if((keys.has('Space')||keys.has('ArrowUp')||keys.has('KeyW')||touchJump)&&jumpY<=.005){vy=8.5}vy-=20*dt;jumpY=Math.max(0,jumpY+vy*dt);if(jumpY===0)vy=0;score+=dt*speed*3;speed=Math.min(32,14+score/500);spawn-=dt;if(spawn<=0){makeItem();spawn=Math.max(.43,1.15-speed*.015)}for(const o of obstacles){o.mesh.position.z+=speed*dt;if(o.type==='coin')o.mesh.rotation.z+=dt*3;if(!o.hit&&Math.abs(o.mesh.position.z-2)<1.1&&Math.abs(o.mesh.position.x-playerX)<1.1){o.hit=true;if(o.type==='coin'){coins+=10;score+=50;scene.remove(o.mesh)}else if(jumpY<1.25){end();break}}}obstacles=obstacles.filter(o=>{if(o.mesh.position.z>17||o.hit){scene.remove(o.mesh);return false}return true});document.getElementById('score').textContent=Math.floor(score);document.getElementById('coins').textContent=coins}
board.position.set(playerX,.5+jumpY+Math.sin(t*3)*.09,2);board.rotation.z=THREE.MathUtils.lerp(board.rotation.z,-steer*.14,.12);camera.position.x=THREE.MathUtils.lerp(camera.position.x,playerX*.35,dt*2);camera.lookAt(playerX*.3,1,-12);renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
