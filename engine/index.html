<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONDA Universe | Product Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#06121f;color:#f9ebd2;font:15px system-ui}header,aside,section{padding:20px;border:1px solid #38536b;border-radius:16px;background:linear-gradient(145deg,#132e43,#071522)}header{margin:12px;display:flex;justify-content:space-between;align-items:center}main{display:grid;grid-template-columns:220px 1fr 300px;gap:12px;margin:12px}h1,h2{margin:0 0 16px}small{color:#a9bdcc}button,input,select{font:inherit;border:1px solid #54748b;border-radius:8px;background:#10283b;color:#fff;padding:10px}button{cursor:pointer}button.active,button:hover{border-color:#ffe629;color:#ffe629}aside button{display:block;width:100%;margin:8px 0;text-align:left}label{display:grid;gap:5px;margin:12px 0}canvas{width:100%;height:400px;display:block}strong{color:#ffe629}#stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}#stats div{padding:14px;background:#081a2b;border-radius:10px} @media(max-width:850px){main{grid-template-columns:1fr}aside button{display:inline-block;width:auto}canvas{height:300px}}
</style><header><div><strong>UNIVERSE ENGINE</strong><br>ONDA / Product Lab</div><small>LOCAL DEMO · No live data</small></header><main><aside><h2>Products</h2><div id="catalog"></div><button id="world">World view</button><button id="export">Export draft JSON</button></aside><section><h2 id="name"></h2><small id="description"></small><canvas id="scene"></canvas><p>Drag to rotate · schematic geometry, not production CAD</p><div id="stats"></div></section><aside><h2>Parameters</h2><label>Variant<select id="variant"></select></label><label>Units<input id="units" type="number" min="0" step="1"></label><label>Units per box<input id="pack" type="number" min="1" step="1"></label><label>Unit cost AUD<input id="unitCost" type="number" min="0" step=".01"></label><label>Box cost AUD<input id="packCost" type="number" min="0" step=".01"></label><label>Unit price AUD<input id="price" type="number" min="0" step=".01"></label><button id="save">Save draft version</button><p id="status" role="status"></p></aside></main><script type="module">
import {products,plan} from './product-core.mjs';
const $=id=>document.getElementById(id),fields=['units','pack','unitCost','packCost','price'];let drafts={};try{drafts=JSON.parse(localStorage.getItem('onda-product-drafts')||'{}')}catch{}let selected=products[0],world=false,angle=.55,drag=false,last=0;
function select(p){selected=p;world=false;const d=drafts[p.id]||{units:60,pack:p.pack,unitCost:2,packCost:1,price:5,version:1};$('name').textContent=p.name;$('description').textContent='Concept · Draft v'+d.version;$('variant').replaceChildren(...p.variants.map(v=>new Option(v,v)));$('variant').value=d.variant||p.variants[0];fields.forEach(k=>$(k).value=d[k]);document.querySelectorAll('#catalog button').forEach(b=>b.classList.toggle('active',b.dataset.id===p.id));render()}
function values(){return Object.fromEntries(fields.map(k=>[k,$(k).valueAsNumber]))}
function render(){try{const a=plan(values());$('stats').replaceChildren(...Object.entries(a).map(([k,v])=>{const d=document.createElement('div');d.textContent=k+': '+(Number.isInteger(v)?v:v.toFixed(2));return d}));$('status').textContent=''}catch(e){$('status').textContent=e.message;$('stats').replaceChildren()}draw()}
const c=$('scene'),ctx=c.getContext('2d');function draw(){const w=c.clientWidth,h=c.clientHeight;c.width=w*devicePixelRatio;c.height=h*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);let g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#163b56');g.addColorStop(1,'#06121f');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);const scale=Math.min(w,h)/10;function project(x,y,z){return [w/2+(x*Math.cos(angle)-z*Math.sin(angle))*scale,h*.65+(x*Math.sin(angle)+z*Math.cos(angle))*scale*.4-y*scale]}function face(points,color){ctx.beginPath();points.forEach((p,i)=>{let q=project(...p);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#b4c6d344';ctx.stroke()}function cube(x,z,y,a,b,d,color){face([[x,y,z],[x+a,y,z],[x+a,y+b,z],[x,y+b,z]],color);face([[x+a,y,z],[x+a,y,z+d],[x+a,y+b,z+d],[x+a,y+b,z]],'#73532a');face([[x,y+b,z],[x+a,y+b,z],[x+a,y+b,z+d],[x,y+b,z+d]],'#ffe0a0')}for(let i=-5;i<=5;i++){face([[i,0,-5],[i+.025,0,-5],[i+.025,0,5],[i,0,5]],'#32617c');face([[-5,0,i],[5,0,i],[5,0,i+.025],[-5,0,i+.025]],'#32617c')}if(world){products.forEach((p,i)=>cube((i%2)*3-3,Math.floor(i/2)*3-3,0,2,1.7,2,'#0f2d4a'));return}cube(-3,-2,0,6,.25,4,'#0f2d4a');const n=Math.min(12,Math.max(0,Number($('pack').value)||0));for(let i=0;i<n;i++){let x=-2.6+(i%4)*1.35,z=-1.7+Math.floor(i/4)*1.1;cube(x,z,.25,1,.55,.8,'#b87937');cube(x,z,.8,1,.28,.8,selected.id==='coins'?'#603821':'#f9ebd2')}}c.onpointerdown=e=>{drag=true;last=e.clientX;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(drag){angle+=(e.clientX-last)*.01;last=e.clientX;draw()}};c.onpointerup=c.onpointercancel=()=>drag=false;window.addEventListener('resize',draw);
products.forEach(p=>{const b=document.createElement('button');b.textContent=p.name;b.dataset.id=p.id;b.onclick=()=>select(p);$('catalog').append(b)});fields.forEach(k=>$(k).oninput=render);$('world').onclick=()=>{world=!world;draw()};$('save').onclick=()=>{try{plan(values());drafts[selected.id]={...values(),variant:$('variant').value,version:(drafts[selected.id]?.version||1)+1};localStorage.setItem('onda-product-drafts',JSON.stringify(drafts));$('description').textContent='Concept · Draft v'+drafts[selected.id].version;$('status').textContent='Saved locally'}catch(e){$('status').textContent=e.message}};$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(drafts,null,2)],{type:'application/json'}));a.download='onda-drafts.json';a.click();URL.revokeObjectURL(a.href)};select(selected);
</script></html>
