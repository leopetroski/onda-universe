<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universe Engine Alpha</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1928;color:#f9ebd2;font:15px system-ui}header,aside,section{padding:20px}header{border-bottom:1px solid #34536c;display:flex;justify-content:space-between;flex-wrap:wrap}h1,h2{color:#ffe629}main{display:grid;grid-template-columns:220px 1fr;min-height:85vh}aside{background:#102438}button,select,input{font:inherit}button,select{background:#193b57;color:#fff;border:1px solid #45617a;border-radius:8px;padding:10px;cursor:pointer}aside button{display:block;width:100%;text-align:left;margin:6px 0}button:hover,button.active{border-color:#ffe629;color:#ffe629}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:#102e45;border:1px solid #34536c;border-radius:12px;padding:18px}label{display:flex;justify-content:space-between;gap:10px;margin:12px 0}input{width:90px;background:#0b1928;color:white;border:1px solid #45617a;padding:5px;border-radius:5px}svg{width:100%;max-height:420px}small{color:#a9c4d7}strong{color:#ffe629}textarea{width:100%;min-height:150px;background:#0b1928;color:white;padding:12px;border:1px solid #45617a} @media(max-width:650px){main{display:block}aside{display:flex;overflow:auto;padding:8px}aside button{min-width:150px}section{padding:12px}}</style><header><b>◉ UNIVERSE ENGINE / ALPHA 0.3</b><select id="universe"><option>ONDA Universe</option><option>MAKTO Universe</option><option>Custom Universe</option></select><small>LOCAL DEMO · NOT LIVE</small></header><main><aside id="nav"></aside><section id="content"></section></main><script>
const pages=['World View','Command Center','Product Lab','Engineering Studio','Production Center','Client Center','Fridge Network','Logistics Center','Memory Center','Developer Studio','Intelligence Center','Object Registry'];const defaults={d:75,h:85,w:350,depth:360,gap:5,clear:120,shelves:3,tolerance:0.75};let db;try{db=JSON.parse(localStorage.getItem('ue-alpha-v03')||'{}')}catch{db={}};let page='World View';const $=id=>document.getElementById(id);const state=()=>db[$('universe').value]??=( {params:{...defaults},notes:{},history:[]} );function save(){try{localStorage.setItem('ue-alpha-v03',JSON.stringify(db))}catch{}}function calc(p){const pitch=p.d+Math.max(p.gap,2*p.tolerance+3),nx=Math.max(0,Math.floor((p.w-6+pitch-p.d-2*p.tolerance)/pitch)),ny=Math.max(0,Math.floor((p.depth-6+pitch-p.d-2*p.tolerance)/pitch));return {pitch,nx,ny,positions:nx*ny,capacity:p.h+10<=p.clear?nx*ny*p.shelves:0,hole:p.d+2*p.tolerance}}function go(p){page=p;render()}function render(){ $('nav').replaceChildren(...pages.map(p=>{let b=document.createElement('button');b.textContent=p;b.className=p===page?'active':'';b.onclick=()=>go(p);return b}));let s=state();$('content').innerHTML='<small>'+ $('universe').value+' / '+page+'</small><h1>'+page+'</h1>';if(page==='World View'){let g=document.createElement('div');g.className='grid';for(let p of pages.slice(1)){let b=document.createElement('button');b.className='card';b.textContent=p;b.onclick=()=>go(p);g.append(b)}$('content').append(g)}else if(['Engineering Studio','Fridge Network','Product Lab','Object Registry'].includes(page)){engineering(s)}else if(page==='Memory Center'){$('content').append(document.createElement('pre'));$('content').lastChild.textContent=JSON.stringify(s.history,null,2)}else{let t=document.createElement('textarea');t.placeholder='Workspace notes and requirements';t.value=s.notes[page]||'';t.oninput=()=>{s.notes[page]=t.value;save()};$('content').append(t);$('content').insertAdjacentHTML('beforeend','<p><small>Workspace shell: integrations and AI are not connected.</small></p>')}let b=document.createElement('button');b.textContent='Export universe JSON';b.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({environment:'demo',universe:$('universe').value,...s},null,2)],{type:'application/json'}));a.download='universe.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('content').append(b)}
function engineering(s){let p=s.params;let g=document.createElement('div');g.className='grid';let controls=document.createElement('div');controls.className='card';controls.innerHTML='<h2>Editable parameters</h2><small>Illustrative dimensions in mm</small>';for(let [k,n,min,max,step] of [['d','Cup diameter',45,120,1],['h','Cup height',40,160,1],['w','Shelf width',200,400,1],['depth','Shelf depth',200,420,1],['gap','Cup gap',2,20,1],['clear','Shelf clearance',60,180,1],['shelves','Shelf count',1,4,1],['tolerance','Radial fit clearance',0,2,.25]]){let l=document.createElement('label');l.textContent=n;let i=document.createElement('input');Object.assign(i,{type:'number',min,max,step,value:p[k]});i.onchange=()=>{let v=i.valueAsNumber;if(!Number.isFinite(v)||v<min||v>max||(k==='shelves'&&!Number.isInteger(v))){i.value=p[k];return}let old=p[k];p[k]=v;s.history.push({time:new Date().toISOString(),parameter:k,old,value:v,result:calc(p)});save();draw()};l.append(i);controls.append(l)}let output=document.createElement('div');output.className='card';g.append(controls,output);$('content').append(g);function draw(){let c=calc(p),scale=Math.min(300/p.w,250/p.depth);let circles='';for(let y=0;y<c.ny;y++)for(let x=0;x<c.nx;x++)circles+=`<circle cx="${170+(x-(c.nx-1)/2)*c.pitch*scale}" cy="${145+(y-(c.ny-1)/2)*c.pitch*scale}" r="${p.d*scale/2}" fill="#d5ac6b" stroke="#ffe629"/>`;output.innerHTML=`<h2>Connected objects</h2><svg viewBox="0 0 340 290"><rect x="${170-p.w*scale/2}" y="${145-p.depth*scale/2}" width="${p.w*scale}" height="${p.depth*scale}" rx="5" fill="#193b57" stroke="#7ca7c7"/>${circles}</svg><p>Positions per shelf: <strong>${c.positions}</strong> · Total: <strong>${c.capacity}</strong></p><p>Proposed support opening: <strong>${c.hole.toFixed(2)} mm</strong></p><p>Cup → Layout → Support parameters → Capacity</p><small>${c.capacity?'Height clearance passes demo rule.':'Height clearance fails.'} Rectangular layout only. Parametric OpenSCAD source available; no airflow or strength validation. Not fabrication-ready.</small>`; add3D(output,p,c)}draw()}
function scad(p,c){return `// DEMO ONLY - verify physical dimensions, material and strength before fabrication
$fn=80;
w=${p.w}; depth=${p.depth}; hole=${c.hole}; pitch=${c.pitch}; nx=${c.nx}; ny=${c.ny};
difference(){ cube([w,depth,8],center=true); if(nx>0 && ny>0) for(x=[0:nx-1]) for(y=[0:ny-1]) translate([(x-(nx-1)/2)*pitch,(y-(ny-1)/2)*pitch,0]) cylinder(h=10,d=hole,center=true); }
`}
function add3D(out,p,c){
let panel=document.createElement('div');panel.innerHTML=`<h2>3D assembly studio</h2><small>Three.js · Internet required for 3D library · DEMO</small><div class="viewport" style="height:390px;background:#0b1928;border-radius:8px;position:relative"></div><label>Exploded view <input class="explode" type="range" min="0" max="100" value="0"></label><label>Component <select class="part"><option>All</option><option>Cup</option><option>Support</option><option>Fridge frame</option></select></label><label>Support appearance <select class="material"><option value="#7ca7c7">Blue polymer</option><option value="#eeeeee">White polymer</option><option value="#333333">Black polymer</option></select></label><p class="selection">Select a component in the viewport.</p><button class="stl">Export demo STL</button> <button class="scad">Export OpenSCAD</button><p><small>Concept geometry only. Not validated for retention, food contact, airflow, strength or fabrication.</small></p>`;out.prepend(panel);
const q=s=>panel.querySelector(s),download=(name,data)=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/plain'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
q('.scad').onclick=()=>download('support-demo.scad',scad(p,c));q('.stl').disabled=true;
(async()=>{try{const T=await import('https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js');if(!panel.isConnected)return;const v=q('.viewport'),scene=new T.Scene();scene.background=new T.Color(0x0b1928);const camera=new T.PerspectiveCamera(42,v.clientWidth/v.clientHeight,1,5000);let angle=.8,tilt=.55,radius=Math.max(p.w,p.depth,p.shelves*p.clear)*2.5;const target=new T.Vector3(0,p.shelves*(p.clear+8)/2,0);function cam(){camera.position.set(target.x+radius*Math.cos(tilt)*Math.sin(angle),target.y+radius*Math.sin(tilt),target.z+radius*Math.cos(tilt)*Math.cos(angle));camera.lookAt(target)}cam();const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(v.clientWidth,v.clientHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));v.append(renderer.domElement);renderer.domElement.style.touchAction='none';scene.add(new T.HemisphereLight(0xffffff,0x334455,2));let light=new T.DirectionalLight(0xffffff,3);light.position.set(300,700,400);scene.add(light);const mat=new T.MeshStandardMaterial({color:0x7ca7c7,roughness:.6}),cupmat=new T.MeshStandardMaterial({color:0xd5ac6b}),cream=new T.MeshStandardMaterial({color:0xf9ebd2}),frameMat=new T.MeshStandardMaterial({color:0xffe629});const parts=[];function mesh(g,m,name,x,y,z,level){let o=new T.Mesh(g,m);o.position.set(x,y,z);o.userData={name,base:y,level};scene.add(o);parts.push(o);return o}
const shape=new T.Shape();shape.moveTo(-p.w/2,-p.depth/2);shape.lineTo(p.w/2,-p.depth/2);shape.lineTo(p.w/2,p.depth/2);shape.lineTo(-p.w/2,p.depth/2);shape.closePath();for(let j=0;j<c.ny;j++)for(let i=0;i<c.nx;i++){let hole=new T.Path();hole.absarc((i-(c.nx-1)/2)*c.pitch,(j-(c.ny-1)/2)*c.pitch,c.hole/2,0,Math.PI*2,true);shape.holes.push(hole)}const tray=new T.ExtrudeGeometry(shape,{depth:8,bevelEnabled:false,curveSegments:32});tray.rotateX(-Math.PI/2);for(let k=0;k<p.shelves;k++){let y=k*(p.clear+8);mesh(tray,mat,'Support',0,y,0,k);for(let j=0;j<c.ny;j++)for(let i=0;i<c.nx;i++){if(!c.capacity)continue;let x=(i-(c.nx-1)/2)*c.pitch,z=(j-(c.ny-1)/2)*c.pitch;mesh(new T.CylinderGeometry(p.d/2,p.d*.38,p.h,32),cupmat,'Cup',x,y+8+p.h/2,z,k+.5);mesh(new T.CylinderGeometry(p.d*.48,p.d*.48,3,32),cream,'Cup',x,y+8+p.h,z,k+.5)}}for(let x of [-p.w/2,p.w/2])for(let z of [-p.depth/2,p.depth/2])mesh(new T.BoxGeometry(5,p.shelves*(p.clear+8),5),frameMat,'Fridge frame',x,p.shelves*(p.clear+8)/2,z,0);
function paint(){renderer.render(scene,camera)}q('.explode').oninput=()=>{for(let o of parts)o.position.y=o.userData.base+o.userData.level*Number(q('.explode').value);paint()};q('.part').onchange=()=>{for(let o of parts)o.visible=q('.part').value==='All'||o.userData.name===q('.part').value;paint()};q('.material').onchange=()=>{mat.color.set(q('.material').value);paint()};let drag=null;const canvas=renderer.domElement;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY,e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;angle-=(e.clientX-drag[0])*.01;tilt=Math.max(.1,Math.min(1.4,tilt+(e.clientY-drag[1])*.01));drag[0]=e.clientX;drag[1]=e.clientY;cam();paint()};canvas.onpointerup=e=>{if(drag&&Math.hypot(e.clientX-drag[2],e.clientY-drag[3])<5){let r=canvas.getBoundingClientRect(),ray=new T.Raycaster();ray.setFromCamera(new T.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),camera);let hit=ray.intersectObjects(parts.filter(o=>o.visible))[0];q('.selection').textContent=hit?'Selected: '+hit.object.userData.name:'No component selected'}drag=null};canvas.onpointercancel=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();radius=Math.max(150,Math.min(4000,radius*Math.exp(e.deltaY*.001)));cam();paint()};q('.stl').disabled=false;q('.stl').onclick=()=>{const g=tray.index?tray.toNonIndexed():tray;let a=g.attributes.position,stl='solid support_demo\n';for(let i=0;i<a.count;i+=3){let vs=[0,1,2].map(j=>new T.Vector3().fromBufferAttribute(a,i+j));let n=vs[1].clone().sub(vs[0]).cross(vs[2].clone().sub(vs[0])).normalize();stl+=`facet normal ${n.x} ${n.y} ${n.z}\nouter loop\n`+vs.map(v=>`vertex ${v.x} ${v.y} ${v.z}\n`).join('')+'endloop\nendfacet\n'}download('support-demo.stl',stl+'endsolid support_demo\n');if(g!==tray)g.dispose()};paint();const observer=new MutationObserver(()=>{if(!panel.isConnected){observer.disconnect();renderer.dispose();for(let g of new Set(parts.map(o=>o.geometry)))g.dispose();for(let m of [mat,cupmat,cream,frameMat])m.dispose()}});observer.observe(document.body,{childList:true,subtree:true});}catch(e){q('.viewport').textContent='3D unavailable: internet or WebGL required. 2D layout and OpenSCAD remain available.'}})();}
$('universe').onchange=render;render();</script></html>
