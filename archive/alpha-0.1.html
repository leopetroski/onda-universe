<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universe Engine Alpha</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1928;color:#f9ebd2;font:15px system-ui}header,aside,section{padding:20px}header{border-bottom:1px solid #34536c;display:flex;justify-content:space-between;flex-wrap:wrap}h1,h2{color:#ffe629}main{display:grid;grid-template-columns:220px 1fr;min-height:85vh}aside{background:#102438}button,select,input{font:inherit}button,select{background:#193b57;color:#fff;border:1px solid #45617a;border-radius:8px;padding:10px;cursor:pointer}aside button{display:block;width:100%;text-align:left;margin:6px 0}button:hover,button.active{border-color:#ffe629;color:#ffe629}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:#102e45;border:1px solid #34536c;border-radius:12px;padding:18px}label{display:flex;justify-content:space-between;gap:10px;margin:12px 0}input{width:90px;background:#0b1928;color:white;border:1px solid #45617a;padding:5px;border-radius:5px}svg{width:100%;max-height:420px}small{color:#a9c4d7}strong{color:#ffe629}textarea{width:100%;min-height:150px;background:#0b1928;color:white;padding:12px;border:1px solid #45617a} @media(max-width:650px){main{display:block}aside{display:flex;overflow:auto;padding:8px}aside button{min-width:150px}section{padding:12px}}</style><header><b>◉ UNIVERSE ENGINE / ALPHA 0.1</b><select id="universe"><option>ONDA Universe</option><option>MAKTO Universe</option><option>Custom Universe</option></select><small>LOCAL DEMO · NOT LIVE</small></header><main><aside id="nav"></aside><section id="content"></section></main><script>
const pages=['World View','Command Center','Product Lab','Engineering Studio','Production Center','Client Center','Fridge Network','Logistics Center','Memory Center','Developer Studio','Intelligence Center','Object Registry'];const defaults={d:75,h:85,w:350,depth:360,gap:5,clear:120,shelves:3,tolerance:0.75};let db;try{db=JSON.parse(localStorage.getItem('ue-alpha')||'{}')}catch{db={}};let page='World View';const $=id=>document.getElementById(id);const state=()=>db[$('universe').value]??=( {params:{...defaults},notes:{},history:[]} );function save(){try{localStorage.setItem('ue-alpha',JSON.stringify(db))}catch{}}function calc(p){const nx=Math.floor((p.w+p.gap)/(p.d+p.gap)),ny=Math.floor((p.depth+p.gap)/(p.d+p.gap));return {nx,ny,positions:nx*ny,capacity:p.h+10<=p.clear?nx*ny*p.shelves:0,hole:p.d+2*p.tolerance}}function go(p){page=p;render()}function render(){ $('nav').replaceChildren(...pages.map(p=>{let b=document.createElement('button');b.textContent=p;b.className=p===page?'active':'';b.onclick=()=>go(p);return b}));let s=state();$('content').innerHTML='<small>'+ $('universe').value+' / '+page+'</small><h1>'+page+'</h1>';if(page==='World View'){let g=document.createElement('div');g.className='grid';for(let p of pages.slice(1)){let b=document.createElement('button');b.className='card';b.textContent=p;b.onclick=()=>go(p);g.append(b)}$('content').append(g)}else if(['Engineering Studio','Fridge Network','Product Lab','Object Registry'].includes(page)){engineering(s)}else if(page==='Memory Center'){$('content').append(document.createElement('pre'));$('content').lastChild.textContent=JSON.stringify(s.history,null,2)}else{let t=document.createElement('textarea');t.placeholder='Workspace notes and requirements';t.value=s.notes[page]||'';t.oninput=()=>{s.notes[page]=t.value;save()};$('content').append(t);$('content').insertAdjacentHTML('beforeend','<p><small>Workspace shell: integrations and AI are not connected.</small></p>')}let b=document.createElement('button');b.textContent='Export universe JSON';b.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({environment:'demo',universe:$('universe').value,...s},null,2)],{type:'application/json'}));a.download='universe.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('content').append(b)}
function engineering(s){let p=s.params;let g=document.createElement('div');g.className='grid';let controls=document.createElement('div');controls.className='card';controls.innerHTML='<h2>Editable parameters</h2><small>Illustrative dimensions in mm</small>';for(let [k,n,min,max,step] of [['d','Cup diameter',45,120,1],['h','Cup height',40,160,1],['w','Shelf width',200,400,1],['depth','Shelf depth',200,420,1],['gap','Cup gap',2,20,1],['clear','Shelf clearance',60,180,1],['shelves','Shelf count',1,4,1],['tolerance','Radial fit clearance',0,2,.25]]){let l=document.createElement('label');l.textContent=n;let i=document.createElement('input');Object.assign(i,{type:'number',min,max,step,value:p[k]});i.onchange=()=>{let v=i.valueAsNumber;if(!Number.isFinite(v)||v<min||v>max){i.value=p[k];return}let old=p[k];p[k]=v;s.history.push({time:new Date().toISOString(),parameter:k,old,value:v,result:calc(p)});save();draw()};l.append(i);controls.append(l)}let output=document.createElement('div');output.className='card';g.append(controls,output);$('content').append(g);function draw(){let c=calc(p),scale=Math.min(300/p.w,250/p.depth);let circles='';for(let y=0;y<c.ny;y++)for(let x=0;x<c.nx;x++)circles+=`<circle cx="${170+(x-(c.nx-1)/2)*(p.d+p.gap)*scale}" cy="${145+(y-(c.ny-1)/2)*(p.d+p.gap)*scale}" r="${p.d*scale/2}" fill="#d5ac6b" stroke="#ffe629"/>`;output.innerHTML=`<h2>Connected objects</h2><svg viewBox="0 0 340 290"><rect x="${170-p.w*scale/2}" y="${145-p.depth*scale/2}" width="${p.w*scale}" height="${p.depth*scale}" rx="5" fill="#193b57" stroke="#7ca7c7"/>${circles}</svg><p>Positions per shelf: <strong>${c.positions}</strong> · Total: <strong>${c.capacity}</strong></p><p>Proposed support opening: <strong>${c.hole.toFixed(2)} mm</strong></p><p>Cup → Layout → Support parameters → Capacity</p><small>${c.capacity?'Height clearance passes demo rule.':'Height clearance fails.'} Rectangular layout only. No CAD regeneration, airflow or strength validation. Not fabrication-ready.</small>`}draw()}
$('universe').onchange=render;render();</script></html>
